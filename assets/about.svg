<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="170"
  viewBox="0 0 1000 170"
>
  <style>
    .text {
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 400;
      fill: #c9d1d9;
    }

    .strong {
      font-weight: 700;
      fill: #f0f6fc;
    }

    @media (prefers-color-scheme: light) {
      .text {
        fill: #57606a;
      }

      .strong {
        fill: #24292f;
      }
    }
  </style>

  <!-- Párrafo 1 -->
  <text x="0" y="25" class="text">
    Soy desarrollador
    <tspan class="strong"> Full Stack</tspan>
    con especialización en backend, orientado a la construcción de sistemas con
  </text>

  <text x="0" y="49" class="text">
    <tspan class="strong">Java, Spring Boot, Python y FastAPI</tspan>.
  </text>

  <!-- Párrafo 2 -->
  <text x="0" y="91" class="text">
    Me apasionan la
    <tspan class="strong"> arquitectura de software</tspan>,
    el
    <tspan class="strong"> código limpio</tspan>
    y el desarrollo de soluciones seguras, eficientes,
  </text>

  <text x="0" y="115" class="text">
    modulares y mantenibles.
  </text>

  <!-- Párrafo 3 -->
  <text x="0" y="157" class="text">
    Actualmente también trabajo con tecnologías como
    <tspan class="strong"> React, React Native, FastAPI, Vue.js y Odoo 19</tspan>.
  </text>
</svg>
