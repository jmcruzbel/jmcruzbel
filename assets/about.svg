<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="275"
  viewBox="0 0 760 275"
  preserveAspectRatio="xMinYMin meet"
>
  <style>
    .text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 21px;
      font-weight: 400;
      fill: #c9d1d9;
    }

    .strong {
      font-weight: 700;
      fill: #f0f6fc;
    }

    @media (prefers-color-scheme: light) {
      .text {
        fill: #57606a;
      }

      .strong {
        fill: #24292f;
      }
    }
  </style>

  <!-- Párrafo 1 -->

  <text x="0" y="28" class="text">
    Soy desarrollador
    <tspan class="strong"> Full Stack</tspan>
    con especialización en backend,
  </text>

  <text x="0" y="58" class="text">
    orientado a la construcción de sistemas con
  </text>

  <text x="0" y="88" class="text">
    <tspan class="strong">Java, Spring Boot, Python y FastAPI</tspan>.
  </text>

  <!-- Párrafo 2 -->

  <text x="0" y="133" class="text">
    Me apasionan la
    <tspan class="strong"> arquitectura de software</tspan>,
    el
    <tspan class="strong"> código limpio</tspan>
  </text>

  <text x="0" y="163" class="text">
    y el desarrollo de soluciones seguras, eficientes,
  </text>

  <text x="0" y="193" class="text">
    modulares y mantenibles.
  </text>

  <!-- Párrafo 3 -->

  <text x="0" y="238" class="text">
    Actualmente también trabajo con tecnologías como
    <tspan class="strong"> React,</tspan>
  </text>

  <text x="0" y="268" class="text">
    <tspan class="strong">React Native, FastAPI, Vue.js y Odoo 19</tspan>.
  </text>
</svg>