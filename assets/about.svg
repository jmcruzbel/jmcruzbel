<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <style>
    .txt {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 24px;
      fill: #c9d1d9;
    }

    .bold {
      font-weight: 700;
      fill: #ffffff;
    }

    @media (prefers-color-scheme: light) {
      .txt {
        fill: #24292f;
      }

      .bold {
        fill: #111827;
      }
    }
  </style>

  <text x="0" y="38" class="txt">
    <tspan x="0" dy="0">
      Soy desarrollador <tspan class="bold">Full Stack</tspan> con especialización en backend, orientado a la
    </tspan>
    <tspan x="0" dy="38">
      construcción de sistemas con <tspan class="bold">Java, Spring Boot, Python y FastAPI</tspan>.
    </tspan>

    <tspan x="0" dy="52">
      Me apasionan la <tspan class="bold">arquitectura de software</tspan>, el
      <tspan class="bold"> código limpio</tspan> y el desarrollo de soluciones
    </tspan>
    <tspan x="0" dy="38">
      seguras, eficientes, modulares y mantenibles.
    </tspan>

    <tspan x="0" dy="52">
      Actualmente también trabajo con tecnologías como
      <tspan class="bold"> React, React Native, FastAPI, Vue.js y Odoo 19</tspan>.
    </tspan>
  </text>
</svg>