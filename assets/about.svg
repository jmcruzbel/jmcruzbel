<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="205"
  viewBox="0 0 760 205"
>
  <style>
    .text {
      font-family: Verdana, Geneva, sans-serif;
      font-size: 16px;
      font-weight: 400;
      fill: #c9d1d9;
    }

    .strong {
      font-weight: 700;
      fill: #f0f6fc;
    }

    @media (prefers-color-scheme: light) {
      .text {
        fill: #57606a;
      }

      .strong {
        fill: #24292f;
      }
    }
  </style>

  <text class="text" x="0" y="24">
    Soy desarrollador
    <tspan class="strong"> Full Stack</tspan>
    con especialización en backend, orientado a la
  </text>

  <text class="text" x="0" y="50">
    construcción de sistemas con
    <tspan class="strong"> Java, Spring Boot, Python y FastAPI</tspan>.
  </text>

  <text class="text" x="0" y="94">
    Me apasionan la
    <tspan class="strong"> arquitectura de software</tspan>,
    el
    <tspan class="strong"> código limpio</tspan>
    y el desarrollo de soluciones
  </text>

  <text class="text" x="0" y="120">
    seguras, eficientes, modulares y mantenibles.
  </text>

  <text class="text" x="0" y="164">
    Actualmente también trabajo con tecnologías como
    <tspan class="strong"> React, React Native,</tspan>
  </text>

  <text class="text" x="0" y="190">
    <tspan class="strong">FastAPI, Vue.js y Odoo 19</tspan>.
  </text>
</svg>